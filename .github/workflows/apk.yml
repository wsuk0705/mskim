name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - run: |
          apk=$(find build/outputs/apk/debug -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" MapHangul-0.0.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MapHangul-test
          path: MapHangul-0.0.5.apk
          if-no-files-found: error
      - name: Publish prototype APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.0.5 MapHangul-0.0.5.apk --target "$GITHUB_SHA" --title "MapHangul 0.0.5" --notes "Android 14+ test APK" --prerelease
